<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>书籍阅读</title><link rel="stylesheet" href="book.css"><link rel="stylesheet" href="reader.css">
</head>
<body>
<header class="toolbar" aria-label="阅读工具">
  <div class="group"><button id="previous" aria-label="上一页" disabled>‹</button><label>页 <input id="page-number" type="number" min="1" value="1" aria-label="页码" disabled></label><span id="page-total"></span><button id="next" aria-label="下一页" disabled>›</button></div>
  <button id="contents" disabled>目录</button><button id="search-open" disabled>搜索</button>
  <div class="group"><button id="mode-overlay" aria-pressed="true" disabled>译文</button><button id="mode-source" aria-pressed="false" disabled>原文</button><button id="mode-compare" aria-pressed="false" disabled>对照</button><button id="mode-text" aria-pressed="false" disabled>文本</button></div>
  <div class="group"><button id="zoom-out" aria-label="缩小" disabled>−</button><select id="zoom" aria-label="缩放"><option value="fit">适合宽度</option><option value="page">整页</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoom-in" aria-label="放大" disabled>＋</button></div>
  <button id="bookmark" aria-pressed="false" disabled>书签</button><button id="version-open" disabled>版本</button><a id="edit-page" target="_blank" rel="noopener noreferrer" hidden>修改此页 ↗</a>
</header>
<main class="workspace" id="workspace">
  <aside id="sidebar" hidden aria-label="目录与搜索">
    <div class="side-head"><strong id="side-title">目录</strong><button id="side-close" aria-label="关闭侧栏">×</button></div>
    <div id="search-tools" hidden><label for="search-query">搜索原文和译文</label><input id="search-query" type="search" placeholder="输入词语，回车搜索" autocomplete="off"><div class="search-options"><select id="search-language" aria-label="搜索范围"><option value="both">原文和译文</option><option value="translation">译文</option><option value="source">原文</option></select><label><input type="checkbox" id="search-case">区分大小写</label></div><button id="search-run">搜索</button><p id="search-summary" role="status"></p></div>
    <div id="side-list"></div>
  </aside>
  <section id="viewport" aria-label="书页" tabindex="0">
    <div id="welcome"><h1>UNDERTALE 本地化</h1><button id="retry-load" disabled>重新加载</button></div>
    <p id="image-message" role="status" hidden></p>
    <div id="page-stage" hidden><div id="page-content"><img id="page-image" alt="原书扫描"><div id="mask-layer"></div><div id="overlay-layer"></div></div></div>
    <article id="text-reader" hidden></article>
  </section>
  <aside id="comparison" hidden aria-label="段落对照"><div class="side-head"><strong>段落对照</strong><button id="comparison-close" aria-label="关闭段落对照">×</button></div><div id="comparison-body"></div></aside>
</main>
<footer><span id="reading-status" role="status"></span><span id="version-status"></span></footer>
<dialog id="version-dialog" aria-labelledby="version-title"><button class="dialog-close" data-close="version-dialog" aria-label="关闭版本">×</button><h2 id="version-title">版本</h2><label for="version-ref">版本名称或编号</label><input id="version-ref" value="main" list="version-options" autocomplete="off"><datalist id="version-options"><option value="main"></option></datalist><p id="version-current"></p><div class="dialog-actions"><button id="version-load">打开此版本</button><button id="version-latest">最新版</button></div><p id="version-message" role="status"></p></dialog>
<div id="toast" role="status" hidden></div>
<script src="composition.js"></script><script src="renderer.js"></script><script type="module" src="reader.js"></script>
</body></html>
